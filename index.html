<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Progress Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase App (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <!-- Firebase Firestore (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <!-- Firebase Auth (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Navigation / Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-2xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-extrabold shadow-md shadow-indigo-200">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-black tracking-tight text-slate-900">Member Progress Tracker</h1>
                    <p class="text-xs text-slate-500 font-medium">Cloud Synchronized Dashboard</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="authModeBtn" onclick="toggleAuthMode()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 transition cursor-pointer flex items-center gap-1.5">
                    <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                    <span id="authModeLabel">Admin Locked</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6">
        
        <!-- Controls & Filters Bar -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-auto flex flex-wrap items-center gap-3">
                <div class="relative flex-1 sm:flex-none sm:w-64">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="resetPageAndRender()" placeholder="Search member name..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm font-medium focus:outline-none focus:border-indigo-500 focus:bg-white transition">
                </div>

                <select id="purokFilter" onchange="resetPageAndRender()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm font-medium focus:outline-none focus:border-indigo-500 transition cursor-pointer">
                    <option value="">All Puroks</option>
                </select>
            </div>

            <div class="w-full md:w-auto flex items-center justify-end gap-2">
                <button id="addMemberBtn" onclick="openAddMemberModal()" class="hidden px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs sm:text-sm font-bold shadow-md shadow-indigo-200 transition cursor-pointer flex items-center gap-1.5">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                    <span>Add Member</span>
                </button>
            </div>
        </div>

        <!-- Members Directory Container -->
        <div id="membersContainer" class="space-y-4">
            <!-- Dynamic members list will render here -->
        </div>

        <!-- Pagination Bar -->
        <div id="paginationContainer" class="flex items-center justify-between bg-white px-4 py-3 rounded-2xl border border-slate-200 shadow-2xs">
            <!-- Dynamic pagination controls -->
        </div>
    </main>

    <!-- Progress Modal (303, 305, 309) -->
    <div id="progressModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <div>
                    <h3 id="progressModalName" class="text-base sm:text-lg font-black text-slate-900 tracking-tight">Member Name</h3>
                    <p id="progressModalSub" class="text-xs text-slate-500 font-semibold">Purok — Grupo</p>
                </div>
                <button onclick="closeProgressModal()" class="w-8 h-8 rounded-lg bg-slate-200/60 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition cursor-pointer">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Modal Navigation Tabs & Date Bar -->
            <div class="px-6 py-3 border-b border-slate-200 bg-white flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                <div class="flex items-center gap-1 border-b sm:border-b-0 border-slate-200 w-full sm:w-auto overflow-x-auto">
                    <button id="tabBtn303" onclick="switchProgressTab('l303')" class="px-4 py-2.5 text-xs sm:text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 whitespace-nowrap cursor-pointer flex items-center gap-1.5">
                        <span>Doktrina 303</span>
                        <span id="tabCount303" class="px-1.5 py-0.5 rounded-full text-[10px] bg-indigo-100 text-indigo-800 font-extrabold">0/30</span>
                    </button>
                    <button id="tabBtn305" onclick="switchProgressTab('l305')" class="px-4 py-2.5 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap cursor-pointer flex items-center gap-1.5 relative">
                        <span>Pulong 305</span>
                        <span id="tabCount305" class="px-1.5 py-0.5 rounded-full text-[10px] bg-slate-100 text-slate-700 font-extrabold">0/15</span>
                        <i id="tabLock305" data-lucide="lock" class="w-3 h-3 text-amber-500"></i>
                    </button>
                    <button id="tabBtn309" onclick="switchProgressTab('c309')" class="px-4 py-2.5 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap cursor-pointer flex items-center gap-1.5">
                        <span>Pagsamba 309</span>
                        <span id="tabCount309" class="px-1.5 py-0.5 rounded-full text-[10px] bg-slate-100 text-slate-700 font-extrabold">0/48</span>
                    </button>
                </div>

                <!-- Date Picker / Year Controls -->
                <div id="standardDateBar" class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                    <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5">
                        <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
                        <input type="date" id="activeLogDate" onchange="syncDateInputs('picker')" class="bg-transparent text-xs font-bold text-slate-700 focus:outline-none cursor-pointer">
                        <input type="hidden" id="activeLogDateText">
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="markAllInTab()" title="Mark All" class="px-2.5 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold transition cursor-pointer">Mark All</button>
                        <button onclick="clearAllInTab()" title="Clear All" class="px-2.5 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold transition cursor-pointer">Clear All</button>
                    </div>
                </div>

                <div id="c309YearBar" class="hidden items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                    <div class="flex items-center gap-1 overflow-x-auto py-1" id="c309YearTabs">
                        <!-- Year tabs generated dynamically -->
                    </div>
                    <span id="c309YearPageCount" class="text-xs font-bold text-slate-500 px-2"></span>
                </div>
            </div>

            <!-- Modal Content Grid -->
            <div id="progressGridContainer" class="p-6 flex-1 overflow-y-auto bg-slate-50/50">
                <div id="progressGrid" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 gap-2.5">
                    <!-- Progress tiles rendered dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition-all transform translate-y-2">
        <i data-lucide="info" class="w-4 h-4 text-indigo-400"></i>
        <span id="toastMessage">Notification message</span>
    </div>

    <!-- Firebase & Main Script Integration -->
    <script>
        // FIREBASE CONFIGURATION (Palitan ng iyong project credentials kung kinakailangan)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForTemplatePlaceholder99",
            authDomain: "tracker-app.firebaseapp.com",
            projectId: "tracker-app",
            storageBucket: "tracker-app.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const STORAGE_KEY = 'member_tracker_data_v4';
        let members = [];
        let isAdmin = true; // Naka-enable bilang default admin para sa madaling pag-edit
        let isSyncingFromCloud = false;
        let isSavingToCloud = false;
        let activeProgressMemberId = null;
        let activeProgressTab = 'l303';
        let active309Year = new Date().getFullYear();
        let currentPage = 1;
        const pageSize = 10;

        let DEFAULT_PUROK_NAMES = {
            "Purok 1": "Purok 1",
            "Purok 2": "Purok 2",
            "Purok 3": "Purok 3",
            "Purok 4": "Purok 4"
        };
        let PUROK_NAMES = { ...DEFAULT_PUROK_NAMES };

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initAppAfterAuth();
        });

        function initAppAfterAuth() {
            auth.signInAnonymously().then(() => {
                loadMembers();
                setupFirestoreRealtimeSync();
            }).catch((error) => {
                console.error("Auth error:", error);
                loadMembers();
            });

            const todayIso = getFormattedDateInput(new Date());
            const activeLogDateEl = document.getElementById('activeLogDate');
            if (activeLogDateEl) activeLogDateEl.value = todayIso;
            const activeLogDateTextEl = document.getElementById('activeLogDateText');
            if (activeLogDateTextEl) activeLogDateTextEl.value = displayDateString(todayIso);
            renderAll();
        }

        // FIREBASE REALTIME SYNC (Optimized with lock to prevent overwrite glitches)
        function setupFirestoreRealtimeSync() {
            db.collection('members').onSnapshot((snapshot) => {
                if (isSavingToCloud || activeProgressMemberId !== null) return;

                isSyncingFromCloud = true;
                const cloudMembers = [];
                snapshot.forEach((doc) => {
                    const m = { id: doc.id, ...doc.data() };
                    if (!m.l303 && m.l310) m.l303 = { ...m.l310 };
                    if (!m.baptismStatus) m.baptismStatus = 'Pending';
                    if (!m.baptismDate) m.baptismDate = '';
                    normalizeMemberC309Structure(m);
                    cloudMembers.push(m);
                });

                if (cloudMembers.length > 0) {
                    members = cloudMembers;
                } else if (members.length > 0 && isAdmin) {
                    migrateLegacyMembersToCloud();
                }

                persistMembersLocal();
                renderAll();
                isSyncingFromCloud = false;
            }, (error) => {
                console.error("Firestore sync error:", error);
            });

            db.collection('tracker_data').doc('metadata').onSnapshot((doc) => {
                if (doc.exists && doc.data().purokNames) {
                    PUROK_NAMES = { ...DEFAULT_PUROK_NAMES, ...doc.data().purokNames };
                    renderAll();
                }
            });
        }

        async function migrateLegacyMembersToCloud() {
            if (!isAdmin || members.length === 0) return;
            const batch = db.batch();
            members.forEach(m => {
                const docRef = db.collection('members').doc(m.id);
                batch.set(docRef, JSON.parse(JSON.stringify(m)));
            });
            try {
                await batch.commit();
            } catch (e) {
                console.error("Migration error:", e);
            }
        }

        // PERSIST MEMBERS WITH FULL STATE OVERWRITE (Wala nang { merge: true } para tuluyang mabura ang tinanggal na petsa)
        function persistMembers(targetMemberId = null) {
            if (!isAdmin) return;
            persistMembersLocal();
            if (!isSyncingFromCloud) {
                isSavingToCloud = true;
                const batch = db.batch();
                const listToSave = targetMemberId
                    ? members.filter(m => m.id === targetMemberId)
                    : members;

                listToSave.forEach(m => {
                    const docRef = db.collection('members').doc(m.id);
                    batch.set(docRef, JSON.parse(JSON.stringify(m)));
                });

                if (!targetMemberId) {
                    batch.set(db.collection('tracker_data').doc('metadata'), {
                        purokNames: PUROK_NAMES,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                }

                batch.commit()
                    .then(() => {
                        setTimeout(() => { isSavingToCloud = false; }, 400);
                    })
                    .catch((err) => {
                        isSavingToCloud = false;
                        console.error("Error saving member to Firestore:", err);
                        showToast('Error saving to Cloud!');
                    });
            }
        }

        function persistMembersLocal() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(members));
            } catch (e) {
                showToast('Storage full!');
            }
        }

        function loadMembers() {
            try {
                const local = localStorage.getItem(STORAGE_KEY);
                if (local) {
                    members = JSON.parse(local);
                }
            } catch (e) {
                members = [];
            }
        }

        function renderAll() {
            renderPurokDropdownOptions();
            renderMembers();
            renderPagination();
            lucide.createIcons();
        }

        function resetPageAndRender() {
            currentPage = 1;
            renderMembers();
            renderPagination();
        }

        function renderPurokDropdownOptions() {
            const select = document.getElementById('purokFilter');
            if (!select) return;
            const currentVal = select.value;
            let html = '<option value="">All Puroks</option>';
            Object.keys(PUROK_NAMES).forEach(pKey => {
                html += `<option value="${pKey}" ${currentVal === pKey ? 'selected' : ''}>${PUROK_NAMES[pKey]}</option>`;
            });
            select.innerHTML = html;
        }

        function renderMembers() {
            const container = document.getElementById('membersContainer');
            if (!container) return;

            const searchInput = document.getElementById('searchInput');
            const purokFilter = document.getElementById('purokFilter');
            const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
            const selectedPurok = purokFilter ? purokFilter.value : '';

            const filtered = members.filter(m => {
                const matchesSearch = (m.fullName || '').toLowerCase().includes(query);
                const matchesPurok = !selectedPurok || m.purok === selectedPurok;
                return matchesSearch && matchesPurok;
            });

            const startIdx = (currentPage - 1) * pageSize;
            const paginated = filtered.slice(startIdx, startIdx + pageSize);

            if (paginated.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-400">
                        <i data-lucide="users" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
                        <p class="text-sm font-bold">No members found.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            paginated.forEach(member => {
                const l303Count = Object.keys(getL303Map(member)).length;
                const l305Count = Object.keys(member.l305 || {}).length;
                const c309Count = getMember309TotalCount(member);

                html += `
                    <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-700 font-extrabold flex items-center justify-center text-sm">
                                ${(member.fullName || 'M').charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h4 class="text-sm sm:text-base font-extrabold text-slate-900">${escapeHtml(member.fullName)}</h4>
                                <p class="text-xs text-slate-500 font-semibold">${escapeHtml(member.purok || 'Unassigned')} — ${escapeHtml(member.purokGrupo || 'Grupo 1')}</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                            <div class="flex items-center gap-2">
                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-indigo-50 text-indigo-700">303: ${l303Count}/30</span>
                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-purple-50 text-purple-700">305: ${l305Count}/15</span>
                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-50 text-emerald-700">309: ${c309Count}/48</span>
                            </div>
                            <button onclick="openProgressModal('${member.id}')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-700 text-xs font-bold transition cursor-pointer flex items-center gap-1">
                                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                <span>View Progress</span>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            renderPagination(filtered.length);
        }

        function renderPagination(totalCount = members.length) {
            const paginationContainer = document.getElementById('paginationContainer');
            if (!paginationContainer) return;

            const totalPages = Math.ceil(totalCount / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            paginationContainer.innerHTML = `
                <span class="text-xs font-bold text-slate-500">Showing page ${currentPage} of ${totalPages} (${totalCount} total)</span>
                <div class="flex items-center gap-1">
                    <button onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''} class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold disabled:opacity-40 cursor-pointer">Prev</button>
                    <button onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''} class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold disabled:opacity-40 cursor-pointer">Next</button>
                </div>
            `;
        }

        function goToPage(page) {
            currentPage = page;
            renderMembers();
        }

        // PROGRESS MODAL LOGIC
        function openProgressModal(memberId) {
            const member = members.find(m => m.id === memberId);
            if (!member) return;
            activeProgressMemberId = memberId;
            activeProgressTab = 'l303';
            active309Year = new Date().getFullYear();

            const nameEl = document.getElementById('progressModalName');
            const subEl = document.getElementById('progressModalSub');
            if (nameEl) nameEl.textContent = member.fullName || '';
            if (subEl) subEl.textContent = `${member.purok || ''} — ${member.purokGrupo || ''}`;

            updateProgressModalTabs();
            renderProgressGrid();

            const modal = document.getElementById('progressModal');
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
            lucide.createIcons();
        }

        function closeProgressModal() {
            const modal = document.getElementById('progressModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
            activeProgressMemberId = null;
            renderAll();
        }

        function switchProgressTab(tabKey) {
            const member = members.find(m => m.id === activeProgressMemberId);
            if (!member) return;

            const isSinusubok = Object.keys(getL303Map(member)).length >= 30;
            if (tabKey === 'l305' && !isSinusubok) {
                showToast('Complete Doktrina 303 (30/30) first to unlock Pulong-Panalangin 305.');
                return;
            }

            activeProgressTab = tabKey;
            updateProgressModalTabs();
            renderProgressGrid();
            lucide.createIcons();
        }

        function updateProgressModalTabs() {
            const member = members.find(m => m.id === activeProgressMemberId);
            if (!member) return;

            const l303Count = Object.keys(getL303Map(member)).length;
            const l305Count = Object.keys(member.l305 || {}).length;
            const c309Count = getMember309TotalCount(member);
            const isSinusubok = l303Count >= 30;

            document.getElementById('tabCount303').textContent = `${l303Count}/30`;
            document.getElementById('tabCount305').textContent = `${l305Count}/15`;
            document.getElementById('tabCount309').textContent = `${c309Count}/48`;

            const stdDateBar = document.getElementById('standardDateBar');
            const yr309Bar = document.getElementById('c309YearBar');
            if (activeProgressTab === 'c309') {
                if (stdDateBar) stdDateBar.classList.add('hidden');
                if (yr309Bar) {
                    yr309Bar.classList.remove('hidden');
                    yr309Bar.classList.add('flex');
                }
                render309YearControls(member);
            } else {
                if (stdDateBar) stdDateBar.classList.remove('hidden');
                if (yr309Bar) {
                    yr309Bar.classList.add('hidden');
                    yr309Bar.classList.remove('flex');
                }
            }

            const lockBadge = document.getElementById('tabLock305');
            if (isSinusubok) {
                if (lockBadge) lockBadge.classList.add('hidden');
            } else {
                if (lockBadge) lockBadge.classList.remove('hidden');
            }

            const tabs = ['l303', 'l305', 'c309'];
            const btnIds = { l303: 'tabBtn303', l305: 'tabBtn305', c309: 'tabBtn309' };

            tabs.forEach(t => {
                const btn = document.getElementById(btnIds[t]);
                if (!btn) return;
                if (t === activeProgressTab) {
                    btn.className = 'px-4 py-2.5 text-xs sm:text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 whitespace-nowrap cursor-pointer flex items-center gap-1.5';
                } else {
                    btn.className = 'px-4 py-2.5 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap cursor-pointer flex items-center gap-1.5';
                }
            });
        }

        function render309YearControls(member) {
            const years = getAvailable309Years(member);
            if (!years.includes(active309Year)) {
                active309Year = new Date().getFullYear();
            }

            const tabsEl = document.getElementById('c309YearTabs');
            const countBadgeEl = document.getElementById('c309YearPageCount');

            if (tabsEl) {
                tabsEl.innerHTML = years.map(yr => {
                    const yrCount = getMember309YearCount(member, yr);
                    const isActive = yr === active309Year;
                    return `
                        <button type="button" onclick="switch309YearPage(${yr})" class="px-2.5 py-1 rounded-lg text-xs font-extrabold border transition cursor-pointer flex items-center gap-1 ${
                            isActive
                                ? 'bg-emerald-600 text-white border-emerald-600 shadow-2xs'
                                : 'bg-white text-slate-700 border-slate-300 hover:bg-emerald-50 hover:border-emerald-300'
                        }">
                            <span>${yr}</span>
                            ${yrCount > 0 ? `<span class="px-1 rounded text-[9px] ${isActive ? 'bg-emerald-800 text-emerald-100' : 'bg-emerald-100 text-emerald-800'}">${yrCount}</span>` : ''}
                        </button>
                    `;
                }).join('');
            }

            if (countBadgeEl) {
                const yrLogged = getMember309YearCount(member, active309Year);
                countBadgeEl.textContent = `${yrLogged} Pagsamba in ${active309Year}`;
            }
        }

        function switch309YearPage(newYr) {
            const yrNum = parseInt(newYr, 10);
            if (!yrNum) return;
            active309Year = yrNum;
            updateProgressModalTabs();
            renderProgressGrid();
        }

        function setWeek309Slot(weekNum, slotType, val) {
            if (!isAdmin) return;
            const idx = members.findIndex(m => m.id === activeProgressMemberId);
            if (idx === -1) return;
            const member = members[idx];
            const byYear = normalizeMemberC309Structure(member);
            const yr = active309Year || new Date().getFullYear();
            byYear[yr] = byYear[yr] || {};

            const entry = byYear[yr][weekNum] || { mw: '', we: '' };

            if (slotType === 'mw') {
                entry.mw = val;
            } else if (slotType === 'we') {
                entry.we = val;
            }

            if (!entry.mw && !entry.we) {
                delete byYear[yr][weekNum];
                if (Object.keys(byYear[yr]).length === 0) {
                    delete byYear[yr];
                }
            } else {
                byYear[yr][weekNum] = entry;
            }

            member.c309 = byYear;
            member.updatedAt = Date.now();
            persistMembers(member.id);
            updateProgressModalTabs();
            renderProgressGrid();
        }

        function renderProgressGrid() {
            const member = members.find(m => m.id === activeProgressMemberId);
            const grid = document.getElementById('progressGrid');
            if (!member || !grid) return;

            if (activeProgressTab === 'c309') {
                grid.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3';
                const byYear = normalizeMemberC309Structure(member);
                const yr = active309Year || new Date().getFullYear();
                const yearWeeks = byYear[yr] || {};
                const availableYears = getAvailable309Years(member);
                let html = '';

                for (let w = 1; w <= 52; w++) {
                    const entry = yearWeeks[w] || { mw: '', we: '' };
                    const weekDates = getDatesForIsoWeek(yr, w);
                    const hasMw = Boolean(entry.mw);
                    const hasWe = Boolean(entry.we);
                    const isMwApproved = entry.mw === 'Approved';
                    const isWeApproved = entry.we === 'Approved';
                    const isMwAbsent = entry.mw === 'Absent';
                    const isWeAbsent = entry.we === 'Absent';
                    const hasAnyPresent = (hasMw && !isMwAbsent && !isMwApproved) || (hasWe && !isWeAbsent && !isWeApproved);
                    const hasAnyApproved = isMwApproved || isWeApproved;
                    const hasAnyAbsent = isMwAbsent || isWeAbsent;

                    let cardBorder = 'border-slate-300 bg-white';
                    let topBarClass = 'border-slate-300 bg-slate-100 text-slate-800';
                    let dividerBorder = 'border-slate-300';
                    if (hasAnyAbsent && !hasAnyPresent) {
                        cardBorder = 'border-rose-400 bg-rose-50/20';
                        topBarClass = 'border-rose-400 bg-rose-600 text-white';
                        dividerBorder = 'border-rose-400';
                    } else if (hasAnyPresent) {
                        cardBorder = 'border-emerald-500 bg-emerald-50/20';
                        topBarClass = 'border-emerald-500 bg-emerald-600 text-white';
                        dividerBorder = 'border-emerald-500';
                    } else if (hasAnyApproved) {
                        cardBorder = 'border-blue-500 bg-blue-50/20';
                        topBarClass = 'border-blue-500 bg-blue-600 text-white';
                        dividerBorder = 'border-blue-500';
                    }

                    const mwCellBg = isMwApproved
                        ? 'bg-blue-600 text-white'
                        : (isMwAbsent ? 'bg-rose-500 text-white' : (hasMw ? 'bg-emerald-500 text-white' : 'bg-white hover:bg-slate-50 text-slate-700'));
                    const weCellBg = isWeApproved
                        ? 'bg-blue-600 text-white'
                        : (isWeAbsent ? 'bg-rose-500 text-white' : (hasWe ? 'bg-teal-600 text-white' : 'bg-white hover:bg-slate-50 text-slate-700'));

                    const mwColored = isMwApproved || isMwAbsent || hasMw;
                    const weColored = isWeApproved || isWeAbsent || hasWe;
                    const yearOptionsHtml = availableYears.map(y => `<option value="${y}" ${y === yr ? 'selected' : ''}>${y}</option>`).join('');

                    html += `
                        <div class="rounded-xl border-2 ${cardBorder} overflow-hidden shadow-2xs flex flex-col">
                            <div class="grid grid-cols-12 border-b-2 ${topBarClass}">
                                <div class="col-span-7 px-2.5 py-1.5 text-xs font-extrabold tracking-tight flex items-center border-r-2 ${dividerBorder}">
                                    WEEK ${w}
                                </div>
                                <div class="col-span-5 px-1.5 py-1 flex items-center justify-center">
                                    <select onchange="switch309YearPage(this.value)" title="Switch Year Page" class="w-full text-[11px] font-extrabold text-center bg-transparent focus:outline-none cursor-pointer ${hasAnyPresent || hasAnyAbsent || hasAnyApproved ? 'text-white [&>option]:text-slate-900' : 'text-slate-700'}">
                                        ${yearOptionsHtml}
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 flex-1">
                                <div class="p-2 border-r-2 ${dividerBorder} flex flex-col items-center justify-center ${mwCellBg} transition">
                                    <span class="text-[10px] font-extrabold uppercase tracking-wider ${mwColored ? 'text-white/90' : 'text-slate-400'}">MW</span>
                                    <select ${!isAdmin ? 'disabled' : ''} onchange="setWeek309Slot(${w}, 'mw', this.value)" class="mt-0.5 w-full text-[11px] font-bold text-center bg-transparent focus:outline-none cursor-pointer ${mwColored ? 'text-white [&>option]:text-slate-900' : 'text-slate-800'}">
                                        <option value="" ${!hasMw ? 'selected' : ''}>— Pick —</option>
                                        <option value="Approved" ${isMwApproved ? 'selected' : ''}>Approved</option>
                                        <option value="${weekDates.wedUs}" ${entry.mw === weekDates.wedUs ? 'selected' : ''}>Wed (${weekDates.wedShort})</option>
                                        <option value="${weekDates.thuUs}" ${entry.mw === weekDates.thuUs ? 'selected' : ''}>Thu (${weekDates.thuShort})</option>
                                    </select>
                                    ${hasMw && !isMwAbsent && !isMwApproved ? `<span class="text-[9px] font-semibold text-white/90 mt-0.5">${escapeHtml(entry.mw)}</span>` : ''}
                                </div>

                                <div class="p-2 flex flex-col items-center justify-center ${weCellBg} transition">
                                    <span class="text-[10px] font-extrabold uppercase tracking-wider ${weColored ? 'text-white/90' : 'text-slate-400'}">WE</span>
                                    <select ${!isAdmin ? 'disabled' : ''} onchange="setWeek309Slot(${w}, 'we', this.value)" class="mt-0.5 w-full text-[11px] font-bold text-center bg-transparent focus:outline-none cursor-pointer ${weColored ? 'text-white [&>option]:text-slate-900' : 'text-slate-800'}">
                                        <option value="" ${!hasWe ? 'selected' : ''}>— Pick —</option>
                                        <option value="Approved" ${isWeApproved ? 'selected' : ''}>Approved</option>
                                        <option value="${weekDates.satUs}" ${entry.we === weekDates.satUs ? 'selected' : ''}>Sat (${weekDates.satShort})</option>
                                        <option value="${weekDates.sunUs}" ${entry.we === weekDates.sunUs ? 'selected' : ''}>Sun (${weekDates.sunShort})</option>
                                    </select>
                                    ${hasWe && !isWeAbsent && !isWeApproved ? `<span class="text-[9px] font-semibold text-white/90 mt-0.5">${escapeHtml(entry.we)}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }
                grid.innerHTML = html;
                return;
            }

            grid.className = 'grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 gap-2.5';
            let maxItems = 30;
            let dataMap = getL303Map(member);
            let activeColor = 'bg-blue-600 text-white border-blue-600 shadow-xs';

            if (activeProgressTab === 'l305') {
                maxItems = 15;
                dataMap = member.l305 || {};
                activeColor = 'bg-purple-600 text-white border-purple-600 shadow-xs';
            }

            let html = '';
            for (let i = 1; i <= maxItems; i++) {
                const recordedDate = dataMap[i];
                const isDone = Boolean(recordedDate);
                html += `
                    <button type="button" ${!isAdmin ? 'disabled' : ''} onclick="toggleProgressTile(${i})" class="p-2.5 rounded-xl border text-center transition cursor-pointer flex flex-col items-center justify-center min-h-[62px] ${
                        isDone ? activeColor : 'bg-white hover:bg-slate-50 text-slate-700 border-slate-200'
                    }">
                        <span class="text-sm font-extrabold leading-none">${i}</span>
                        <span class="text-[10px] font-semibold mt-1 tracking-tight ${isDone ? 'text-white/95' : 'text-slate-400'}">
                            ${isDone ? escapeHtml(displayDateString(recordedDate)) : '—'}
                        </span>
                    </button>
                `;
            }
            grid.innerHTML = html;
        }

        function toggleProgressTile(num) {
            if (!isAdmin) return;
            const idx = members.findIndex(m => m.id === activeProgressMemberId);
            if (idx === -1) return;

            const member = members[idx];
            if (!member.l303) member.l303 = { ...getL303Map(member) };
            if (!member.l305) member.l305 = {};
            if (!member.c309) member.c309 = {};

            if (activeProgressTab === 'l303' && member.l310) {
                delete member.l310;
            }

            const map = member[activeProgressTab];
            const dateText = document.getElementById('activeLogDateText').value.trim() || getTodayUsFormatted();

            if (map[num]) {
                delete map[num];
            } else {
                map[num] = dateText;
            }

            member.updatedAt = Date.now();
            persistMembers(member.id);
            updateProgressModalTabs();
            renderProgressGrid();
        }

        function markAllInTab() {
            if (!isAdmin) return;
            const idx = members.findIndex(m => m.id === activeProgressMemberId);
            if (idx === -1) return;

            const member = members[idx];
            if (!member.l303) member.l303 = { ...getL303Map(member) };
            if (!member.l305) member.l305 = {};
            if (!member.c309) member.c309 = {};

            if (activeProgressTab === 'c309') {
                const yr = active309Year || new Date().getFullYear();
                const byYear = normalizeMemberC309Structure(member);
                byYear[yr] = byYear[yr] || {};
                for (let w = 1; w <= 24; w++) {
                    const dates = getDatesForIsoWeek(yr, w);
                    byYear[yr][w] = { mw: dates.wedUs, we: dates.satUs };
                }
                member.c309 = byYear;
            } else {
                const maxItems = activeProgressTab === 'l303' ? 30 : 15;
                const dateText = document.getElementById('activeLogDateText').value.trim() || getTodayUsFormatted();
                const map = member[activeProgressTab];

                if (activeProgressTab === 'l303' && member.l310) delete member.l310;

                for (let i = 1; i <= maxItems; i++) {
                    if (!map[i]) map[i] = dateText;
                }
            }

            member.updatedAt = Date.now();
            persistMembers(member.id);
            updateProgressModalTabs();
            renderProgressGrid();
        }

        function clearAllInTab() {
            if (!isAdmin) return;
            const idx = members.findIndex(m => m.id === activeProgressMemberId);
            if (idx === -1) return;

            const member = members[idx];
            if (activeProgressTab === 'c309') {
                const yr = active309Year || new Date().getFullYear();
                const byYear = normalizeMemberC309Structure(member);
                delete byYear[yr];
                member.c309 = byYear;
            } else {
                member[activeProgressTab] = {};
                if (activeProgressTab === 'l303') {
                    delete member.l310;
                }
            }

            member.updatedAt = Date.now();
            persistMembers(member.id);
            updateProgressModalTabs();
            renderProgressGrid();
        }

        // HELPERS
        function getL303Map(member) {
            if (!member) return {};
            return member.l303 || member.l310 || {};
        }

        function normalizeMemberC309Structure(member) {
            if (!member) return {};
            const raw = member.c309;
            if (!raw || typeof raw !== 'object') {
                member.c309 = {};
                return member.c309;
            }

            const byYear = {};
            const defaultYr = new Date().getFullYear();
            let needsMigration = false;

            Object.keys(raw).forEach(k => {
                const numKey = Number(k);
                const val = raw[k];
                if (!val || typeof val !== 'object') return;

                if (numKey >= 2000 && numKey <= 2200) {
                    byYear[numKey] = byYear[numKey] || {};
                    Object.keys(val).forEach(wk => {
                        const slot = val[wk];
                        if (slot && typeof slot === 'object') {
                            byYear[numKey][wk] = {
                                mw: slot.mw || '',
                                we: slot.we || ''
                            };
                        }
                    });
                } else {
                    needsMigration = true;
                    const yr = Number(val.yr) || defaultYr;
                    byYear[yr] = byYear[yr] || {};
                    byYear[yr][k] = {
                        mw: val.mw || '',
                        we: val.we || ''
                    };
                }
            });

            if (needsMigration) {
                member.c309 = byYear;
            }
            return byYear;
        }

        function getMember309TotalCount(member) {
            const byYear = normalizeMemberC309Structure(member);
            let total = 0;
            Object.keys(byYear).forEach(yr => {
                const weeks = byYear[yr];
                if (weeks && typeof weeks === 'object') {
                    Object.keys(weeks).forEach(wk => {
                        const slot = weeks[wk];
                        if (slot) {
                            if (slot.mw) total++;
                            if (slot.we) total++;
                        }
                    });
                }
            });
            return total;
        }

        function getMember309YearCount(member, yr) {
            const byYear = normalizeMemberC309Structure(member);
            const weeks = byYear[yr];
            if (!weeks || typeof weeks !== 'object') return 0;
            let count = 0;
            Object.keys(weeks).forEach(wk => {
                const slot = weeks[wk];
                if (slot) {
                    if (slot.mw) count++;
                    if (slot.we) count++;
                }
            });
            return count;
        }

        function getAvailable309Years(member) {
            const byYear = normalizeMemberC309Structure(member);
            const yrs = Object.keys(byYear).map(y => parseInt(y, 10)).filter(y => !isNaN(y));
            const currentYr = new Date().getFullYear();
            if (!yrs.includes(currentYr)) yrs.push(currentYr);
            yrs.sort((a, b) => b - a);
            return yrs;
        }

        function getDatesForIsoWeek(year, week) {
            const simple = new Date(year, 0, 1 + (week - 1) * 7);
            const dow = simple.getDay();
            const isoStart = new Date(simple);
            if (dow <= 4) isoStart.setDate(simple.getDate() - simple.getDay() + 1);
            else isoStart.setDate(simple.getDate() + 8 - simple.getDay());

            const wed = new Date(isoStart); wed.setDate(isoStart.getDate() + 2);
            const thu = new Date(isoStart); thu.setDate(isoStart.getDate() + 3);
            const sat = new Date(isoStart); sat.setDate(isoStart.getDate() + 5);
            const sun = new Date(isoStart); sun.setDate(isoStart.getDate() + 6);

            return {
                wedUs: getFormattedDateInput(wed),
                wedShort: `${wed.getMonth() + 1}/${wed.getDate()}`,
                thuUs: getFormattedDateInput(thu),
                thuShort: `${thu.getMonth() + 1}/${thu.getDate()}`,
                satUs: getFormattedDateInput(sat),
                satShort: `${sat.getMonth() + 1}/${sat.getDate()}`,
                sunUs: getFormattedDateInput(sun),
                sunShort: `${sun.getMonth() + 1}/${sun.getDate()}`
            };
        }

        function getFormattedDateInput(date) {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            const year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        }

        function getTodayUsFormatted() {
            return getFormattedDateInput(new Date());
        }

        function displayDateString(isoDateStr) {
            if (!isoDateStr) return '';
            const parts = isoDateStr.split('-');
            if (parts.length !== 3) return isoDateStr;
            return `${parts[1]}/${parts[2]}/${parts.slice(0, 2).join('-')}`;
        }

        function syncDateInputs(source) {
            const picker = document.getElementById('activeLogDate');
            const text = document.getElementById('activeLogDateText');
            if (picker && text) {
                text.value = picker.value;
            }
        }

        function toggleAuthMode() {
            isAdmin = !isAdmin;
            const label = document.getElementById('authModeLabel');
            if (label) {
                label.textContent = isAdmin ? 'Admin Unlocked' : 'Admin Locked';
            }
            showToast(isAdmin ? 'Admin Mode Unlocked' : 'Admin Mode Locked');
            renderAll();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            if (toast && msgEl) {
                msgEl.textContent = msg;
                toast.classList.remove('hidden', 'translate-y-2');
                setTimeout(() => {
                    toast.classList.add('hidden', 'translate-y-2');
                }, 3000);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
